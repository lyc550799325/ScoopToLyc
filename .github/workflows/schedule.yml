name: Excavator

on:
  # 手动触发，方便失败后补跑
  workflow_dispatch:
  schedule:
    # UTC 00:00 / 12:00 → 上海 08:00 / 20:00
    # 注意：GitHub Actions 的 cron 只认 UTC，不支持时区配置
    - cron: "0 0,12 * * *"

# 同分支重复触发时，取消正在跑的旧任务，避免堆积
concurrency:
  group: excavator
  cancel-in-progress: true

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: "1"
